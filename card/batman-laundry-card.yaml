# Batman Laundry Card v2 (Home Assistant dashboard card)
#
# Requirements:
#   - Home Assistant picture-elements card (built in)
#   - custom:button-card (HACS, "button-card" by RomRider)   -> progress rings and labels
#   - Browser Mod (HACS)                                      -> tap-to-open pop-ups
#
# Images: copy everything from the repo's images/ folder to
#   /config/www/batman-laundry-card/
# so they are served as /local/batman-laundry-card/<file>.
# Always use /local/... paths, never an absolute address with your IP in front (that breaks outside your LAN).
#
# Entities: the card is written for Samsung (SmartThings "LocalThings"-style) entities.
# Two prefixes appear throughout. Find and replace them with your own machine prefixes:
#
#   samsung_washer_da_wm_tp1_21_common_   ->  <your washer entity prefix>_
#   samsung_dryer_da_wm_tp1_21_common_    ->  <your dryer entity prefix>_
#
# Also needed: input_text.laundry_label (see configuration/input_text.yaml).
#
# Pop-up rows: a few pop-up entities start with "hallway_" (for example
# select.hallway_samsung_washer_da_wm_tp1_21_common_soil_level). Those IDs are specific to the
# author's install. Fix or delete those rows if they do not exist on your system; the card
# itself works without them. See the README for the full entity-role table.
#
# Paste everything below into: Edit dashboard > Add card > Manual.
type: picture-elements
image: /local/batman-laundry-card/Batman_Laundry_Empty.png
elements:
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_running
    state: 'on'
  elements:
  - type: image
    entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_running
    image: /local/batman-laundry-card/Batman_Laundry_Clothes.png
    style:
      left: 0%
      top: 0%
    tap_action:
      action: none
    hold_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_running
    state: 'on'
  - condition: state
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    state:
    - prewash
    - wash
    - rinse
    - spin
    - predrain
    - weightsensing
  elements:
  - type: image
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    image: /local/batman-laundry-card/Batman_Laundry_Rinse.gif
    state_image:
      wash: /local/batman-laundry-card/Batman_Laundry_Rinse.gif
      rinse: /local/batman-laundry-card/Batman_Laundry_Sin.gif
      spin: /local/batman-laundry-card/Batman_Laundry_Spin.gif
    style:
      left: 0%
      top: 0%
    tap_action:
      action: none
    hold_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: binary_sensor.samsung_dryer_da_wm_tp1_21_common_running
    state: 'on'
  - condition: state
    entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_running
    state: 'off'
  - condition: state
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    state_not: finish
  elements:
  - type: image
    entity: binary_sensor.samsung_dryer_da_wm_tp1_21_common_running
    image: /local/batman-laundry-card/Batman_Laundry_Spin.gif
    style:
      left: 0%
      top: 0%
    tap_action:
      action: none
    hold_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    state: finish
  elements:
  - type: image
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    image: /local/batman-laundry-card/Batmn_Laundry_Done.gif
    style:
      left: 0%
      top: 0%
    tap_action:
      action: none
    hold_action:
      action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.samsung_dryer_da_wm_tp1_21_common_progress
    state: finish
  - condition: state
    entity: sensor.samsung_washer_da_wm_tp1_21_common_progress
    state_not: finish
  elements:
  - type: image
    entity: sensor.samsung_dryer_da_wm_tp1_21_common_progress
    image: /local/batman-laundry-card/Batmn_Laundry_Done.gif
    style:
      left: 0%
      top: 0%
    tap_action:
      action: none
    hold_action:
      action: none
- type: state-label
  entity: input_text.laundry_label
  style:
    left: 24%
    top: 8%
    color: black
    font-size: 25px
    font-weight: bold
    z-index: 10
    pointer-events: none
  tap_action:
    action: none
- type: conditional
  conditions:
  - condition: state
    entity: sensor.samsung_washer_da_wm_tp1_21_common_machine_state
    state:
    - active
    - pause
  - condition: state
    entity: sensor.samsung_dryer_da_wm_tp1_21_common_machine_state
    state: idle
  elements:
  - type: image
    entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_running
    image: /local/batman-laundry-card/transparent.png
    style:
      left: 0%
      top: 0%
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: Washer controls
          dismissable: true
          size: normal
          content:
            type: vertical-stack
            cards:
            - type: markdown
              content: |-
                ### Washer
                {% set e='sensor.samsung_washer_da_wm_tp1_21_common_' %}{{ states(e~'progress')|title }} · {{ states(e~'machine_state')|title }}{% if is_state('binary_sensor.samsung_washer_da_wm_tp1_21_common_running','on') %} · {{ states(e~'completion_time') }} min left{% endif %}
            - type: horizontal-stack
              cards:
              - type: button
                name: Start
                icon: mdi:play-circle-outline
                show_state: false
                icon_height: 40px
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.samsung_washer_da_wm_tp1_21_common_start
                  confirmation:
                    text: Start the washer?
                hold_action:
                  action: none
              - type: button
                name: Pause
                icon: mdi:pause-circle-outline
                show_state: false
                icon_height: 40px
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.samsung_washer_da_wm_tp1_21_common_pause
                hold_action:
                  action: none
              - type: button
                name: Stop
                icon: mdi:stop-circle-outline
                show_state: false
                icon_height: 40px
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.samsung_washer_da_wm_tp1_21_common_stop
                  confirmation:
                    text: Stop the washer? This ends the current cycle.
                hold_action:
                  action: none
                styles:
                  icon:
                  - color: '#b5372b'
            - type: markdown
              content: '{% set e=''sensor.samsung_washer_da_wm_tp1_21_common_'' %}**{{ states(e~''energy'')|float(0)|round(1) }}** kWh energy &nbsp;·&nbsp; **{{ states(e~''water_consumption'')|float(0)|round(0)|int }}** gal water &nbsp;·&nbsp; **{{ states(e~''drum_clean_due_in'') }}** loads until drum clean'
            - type: entities
              title: Settings
              show_header_toggle: false
              entities:
              - entity: select.samsung_washer_da_wm_tp1_21_common_cycle
                name: Cycle
              - entity: select.samsung_washer_da_wm_tp1_21_common_wash_temperature
                name: Wash temperature
              - entity: select.samsung_washer_da_wm_tp1_21_common_spin_speed
                name: Spin speed
              - entity: select.hallway_samsung_washer_da_wm_tp1_21_common_soil_level
                name: Soil level
              - entity: select.samsung_washer_da_wm_tp1_21_common_rinse_cycles
                name: Rinse cycles
              - entity: number.samsung_washer_da_wm_tp1_21_common_delay_start
                name: Delay start (hours)
              - entity: select.hallway_samsung_washer_da_wm_tp1_21_common_laundry_out_reminder
                name: Laundry-out reminder (min)
              - entity: time.hallway_samsung_washer_da_wm_tp1_21_common_finish_by
                name: Finish by
            - type: entities
              title: Status & maintenance
              show_header_toggle: false
              entities:
              - entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_detergent_low
                name: Detergent low
              - entity: binary_sensor.hallway_samsung_washer_da_wm_tp1_21_common_child_lock
                name: Child lock
              - entity: sensor.samsung_washer_da_wm_tp1_21_common_alarm_code
                name: Alarm
              - entity: sensor.hallway_samsung_washer_da_wm_tp1_21_common_drum_last_cleaned
                name: Drum last cleaned
              - entity: binary_sensor.samsung_washer_da_wm_tp1_21_common_firmware_update_available
                name: Firmware update available
              - entity: button.samsung_washer_da_wm_tp1_21_common_start_diagnosis
                name: Drum clean diagnosis
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.samsung_washer_da_wm_tp1_21_common_start_diagnosis
                  confirmation:
                    text: Run the washer diagnosis?
    hold_action:
      action: none
